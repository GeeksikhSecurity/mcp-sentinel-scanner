name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Unit tests
        run: |
          python -m pytest -q

      - name: Repo corpus smoke (offline/local fixtures)
        # PYTHONPATH=. so `from scripts.repo_corpus_runner import ...` resolves —
        # running `python scripts/X.py` puts scripts/ (not repo root) on sys.path,
        # and the `scripts` package is not part of the installed wheel.
        run: |
          PYTHONPATH=. python scripts/run_repo_corpus.py --tier smoke --manifest configs/repo_corpus.json --output-dir reports/repo_corpus

      - name: Upload corpus artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo-corpus-smoke
          path: reports/repo_corpus


