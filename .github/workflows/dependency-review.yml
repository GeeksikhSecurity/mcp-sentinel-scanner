name: Dependency Review

# Review dependencies in pull requests for vulnerabilities and license compliance
# Requires GitHub Teams or higher

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # Fail on moderate or higher severity vulnerabilities
          fail-on-severity: moderate

          # Check both runtime and development dependencies
          fail-on-scopes: runtime, development

          # Always comment summary in PR for visibility
          comment-summary-in-pr: always

          # Show vulnerabilities even if below failure threshold
          warn-only: false

          # Deny specific licenses (copyleft)
          deny-licenses: GPL-3.0, AGPL-3.0, GPL-2.0

          # Allow common permissive licenses
          allow-licenses: MIT, Apache-2.0, BSD-3-Clause, BSD-2-Clause, ISC

      - name: Generate summary
        if: always()
        run: |
          echo "### 🔍 Dependency Review Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This PR has been analyzed for:" >> $GITHUB_STEP_SUMMARY
          echo "- 🐛 Known security vulnerabilities" >> $GITHUB_STEP_SUMMARY
          echo "- 📜 License compliance issues" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 New dependencies added" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Review the check details above for any findings." >> $GITHUB_STEP_SUMMARY
