name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday at 2 AM

jobs:
  security-scan:
    name: MCP Sentinel Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run security scan (JSON)
        run: |
          python -m scripts.sentinel_cli . \
            --exclude "node_modules" "*.d.ts" "dist" "build" ".git" \
            --format json \
            -o reports/scan-results.json \
            --severity LOW
        continue-on-error: true

      - name: Run security scan (SARIF)
        run: |
          python -m scripts.sentinel_cli . \
            --exclude "node_modules" "*.d.ts" "dist" "build" ".git" \
            --format sarif \
            -o reports/results.sarif \
            --severity LOW
        continue-on-error: true

      - name: Run security scan (HTML)
        run: |
          python -m scripts.sentinel_cli . \
            --exclude "node_modules" "*.d.ts" "dist" "build" ".git" \
            --format html \
            -o reports/security-report.html \
            --severity LOW
        continue-on-error: true

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: reports/results.sarif
          category: mcp-sentinel

      - name: Upload HTML report as artifact
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: security-report
          path: reports/security-report.html
          retention-days: 30

      - name: Upload JSON results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: scan-results
          path: reports/scan-results.json
          retention-days: 90

      - name: Analyze scan results
        if: always()
        run: |
          if [ -f reports/scan-results.json ]; then
            CRITICAL=$(jq '.scan_summary.severity_distribution.CRITICAL // 0' reports/scan-results.json)
            HIGH=$(jq '.scan_summary.severity_distribution.HIGH // 0' reports/scan-results.json)
            MEDIUM=$(jq '.scan_summary.severity_distribution.MEDIUM // 0' reports/scan-results.json)
            TOTAL=$(jq '.scan_summary.vulnerabilities_found' reports/scan-results.json)
            ASR=$(jq '.scan_summary.asr_score' reports/scan-results.json)

            echo "### 🛡️ Security Scan Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| 🔴 Critical | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟠 High | $HIGH |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟡 Medium | $MEDIUM |" >> $GITHUB_STEP_SUMMARY
            echo "| **Total** | **$TOTAL** |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**ASR Score:** $(echo $ASR | awk '{printf "%.1f%%", $1*100}')" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check vulnerability thresholds
        run: |
          if [ -f reports/scan-results.json ]; then
            CRITICAL=$(jq '.scan_summary.severity_distribution.CRITICAL // 0' reports/scan-results.json)

            if [ "$CRITICAL" -gt 0 ]; then
              echo "::error::Found $CRITICAL critical vulnerabilities!"
              exit 1
            fi
          fi

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('reports/scan-results.json')) {
              return;
            }

            const scan = JSON.parse(fs.readFileSync('reports/scan-results.json'));
            const summary = scan.scan_summary;

            const severityIcons = {
              'CRITICAL': '🔴',
              'HIGH': '🟠',
              'MEDIUM': '🟡',
              'LOW': '🟢'
            };

            let severityTable = '| Severity | Count |\n|----------|-------|\n';
            for (const [severity, count] of Object.entries(summary.severity_distribution)) {
              const icon = severityIcons[severity] || '⚪';
              severityTable += `| ${icon} ${severity} | ${count} |\n`;
            }

            const comment = `## 🛡️ MCP Sentinel Security Scan Results

            - **Files Scanned:** ${summary.files_scanned}
            - **Total Vulnerabilities:** ${summary.vulnerabilities_found}
            - **ASR Score:** ${(summary.asr_score * 100).toFixed(1)}%
            - **Scan Time:** ${summary.scan_time.toFixed(2)}s

            ### Severity Distribution

            ${severityTable}

            ${summary.severity_distribution.CRITICAL > 0 ? '⚠️ **Critical vulnerabilities detected! Please review and fix before merging.**' : '✅ No critical vulnerabilities found.'}

            [📄 View Full Report](../actions/runs/${{ github.run_id }})`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
