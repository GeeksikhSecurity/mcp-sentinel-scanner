rules:
  # ============================================================
  # MCP & AI Security Patterns
  # These are not covered by semgrep --config=auto
  # ============================================================

  - id: mcp-prompt-leakage
    patterns:
      - pattern-regex: "NEVER\\s+REVEAL\\s+THIS\\s+PROMPT"
    message: >
      System prompt / guardrail text detected in source code. This is a prompt
      leakage risk — if this file is served or committed publicly, the system
      prompt is exposed. Store prompts as secure configuration, not source code.
    languages: [generic]
    severity: WARNING
    metadata:
      cwe: ["CWE-200"]
      category: security
      subcategory: [ai-security]
      confidence: MEDIUM
      owasp: ["LLM06: Sensitive Information Disclosure"]

  - id: mcp-tool-description-injection
    patterns:
      - pattern-regex: "(tool_description|toolDescription)\\s*[:=].*\\{\\{.*\\}\\}"
    message: >
      MCP tool description contains template interpolation. Tool descriptions
      are rendered by LLM clients — injectable content here is a tool poisoning
      vector (OWASP LLM07: Insecure Plugin/Tool Design).
    languages: [generic]
    severity: WARNING
    metadata:
      cwe: ["CWE-94"]
      category: security
      subcategory: [ai-security, mcp]
      confidence: MEDIUM

  - id: mcp-unsanitized-tool-output
    patterns:
      - pattern: |
          $OUTPUT = $TOOL.call_tool(...)
          ...
          $LLM.create(..., messages=[..., {"content": $OUTPUT}, ...], ...)
    message: >
      Raw MCP tool output passed directly to LLM without sanitization. Tool
      outputs may contain prompt injection payloads. Validate and sanitize
      before including in LLM context (OWASP LLM02).
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-74"]
      category: security
      subcategory: [ai-security, mcp]

  - id: ai-unsafe-prompt-concat-python
    patterns:
      - pattern: |
          $PROMPT = ... + $USER_INPUT + ...
      - metavariable-regex:
          metavariable: $PROMPT
          regex: "(?i).*(prompt|instruction|system_message|messages).*"
    message: >
      User input concatenated directly into an AI prompt variable. Use
      parameterized prompt templates to prevent prompt injection.
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-74"]
      category: security
      subcategory: [ai-security]
      owasp: ["LLM01: Prompt Injection"]

  - id: ai-unsafe-prompt-concat-js
    patterns:
      - pattern: |
          $PROMPT = ... + $USER_INPUT + ...
      - metavariable-regex:
          metavariable: $PROMPT
          regex: "(?i).*(prompt|instruction|systemMessage|messages).*"
    message: >
      User input concatenated directly into an AI prompt variable. Use
      parameterized prompt templates to prevent prompt injection.
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: ["CWE-74"]
      category: security
      subcategory: [ai-security]
      owasp: ["LLM01: Prompt Injection"]

  - id: ai-eval-llm-output
    patterns:
      - pattern-either:
          - pattern: eval($LLM_RESPONSE)
          - pattern: exec($LLM_RESPONSE)
          - pattern: compile($LLM_RESPONSE, ...)
    message: >
      LLM output passed to eval/exec/compile. This allows arbitrary code
      execution if the model is compromised or manipulated via prompt injection
      (OWASP LLM02: Insecure Output Handling).
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-95"]
      category: security
      subcategory: [ai-security]

  # ============================================================
  # Hardcoded Secrets (supplement TruffleHog verified-only mode)
  # Catches patterns TruffleHog may not verify
  # ============================================================

  - id: hardcoded-react-env-secret
    pattern-regex: "REACT_APP_[A-Z_]*(?:KEY|SECRET|TOKEN)\\s*=\\s*['\"]?[^'\"\\s]{10,}"
    message: >
      Hardcoded API key in React environment variable. REACT_APP_ variables
      are embedded in the client bundle at build time and visible to users.
      Use build-time injection from CI/CD secrets, not .env files in source.
    languages: [generic]
    severity: ERROR
    metadata:
      cwe: ["CWE-798"]
      category: security
      confidence: HIGH

  - id: hardcoded-next-public-secret
    pattern-regex: "NEXT_PUBLIC_[A-Z_]*(?:KEY|SECRET|TOKEN)\\s*=\\s*['\"]?[^'\"\\s]{10,}"
    message: >
      Hardcoded secret in Next.js public environment variable. NEXT_PUBLIC_
      variables are inlined into the client bundle. Use server-only env vars
      or runtime secrets injection.
    languages: [generic]
    severity: ERROR
    metadata:
      cwe: ["CWE-798"]
      category: security
      confidence: HIGH

  # ============================================================
  # npm Script Injection (supplement npm audit)
  # ============================================================

  - id: npm-suspicious-lifecycle-script
    patterns:
      - pattern-regex: '"(preinstall|postinstall|preuninstall)"\\s*:\\s*"[^"]*(curl|wget|rm\\s+-rf|eval|exec|base64|\\|\\s*sh|\\|\\s*bash)[^"]*"'
    message: >
      Suspicious command in npm lifecycle script. Lifecycle hooks
      (preinstall/postinstall) execute automatically and are a common supply
      chain attack vector. Review the command for malicious intent.
    languages: [json]
    severity: ERROR
    metadata:
      cwe: ["CWE-78"]
      category: security
      subcategory: [supply-chain]
      confidence: HIGH

  # ============================================================
  # localStorage Sensitive Data (React/JS specific)
  # ============================================================

  - id: localstorage-sensitive-data
    patterns:
      - pattern-either:
          - pattern: localStorage.setItem("token", ...)
          - pattern: localStorage.setItem("jwt", ...)
          - pattern: localStorage.setItem("auth", ...)
          - pattern: localStorage.setItem("session", ...)
          - pattern: localStorage.setItem("apiKey", ...)
          - pattern: localStorage.setItem("api_key", ...)
    message: >
      Sensitive authentication data stored in localStorage. localStorage is
      accessible to any JavaScript on the page (XSS risk). Use httpOnly
      cookies or secure session storage instead.
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      cwe: ["CWE-922"]
      category: security
      confidence: HIGH

  # ============================================================
  # Insecure Deserialization (Python-specific supplements)
  # ============================================================

  - id: python-yaml-unsafe-load
    patterns:
      - pattern-either:
          - pattern: yaml.load(..., Loader=None)
          - pattern: yaml.load($X)
      - pattern-not: yaml.load(..., Loader=yaml.SafeLoader)
      - pattern-not: yaml.load(..., Loader=yaml.CSafeLoader)
      - pattern-not: yaml.safe_load(...)
    message: >
      yaml.load() without SafeLoader allows arbitrary Python object
      deserialization. Use yaml.safe_load() or yaml.load(data, Loader=yaml.SafeLoader).
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-502"]
      category: security
      confidence: HIGH

  # ============================================================
  # MCP Bug-Bounty Lesson Archetypes (mcp-huntr sweep, 2026-07/08)
  # Each rule below is the mechanical form of one ranked archetype from
  # MCP-SCAN-LESSONS.md — see that doc for the yield evidence per archetype.
  # All four were validated against true-positive/true-negative fixtures
  # with `semgrep --test` before being added here (see tests/semgrep/); two
  # had non-functional patterns in the original draft that would not have
  # matched real code — fixed below, noted per rule.
  # ============================================================

  - id: mcp-nodejs-shell-string-interpolation
    patterns:
      - pattern-either:
          - pattern: child_process.exec(`...${$VAR}...`, ...)
          - pattern: child_process.exec($STR + $VAR, ...)
          - pattern: exec(`...${$VAR}...`, ...)
          - pattern: $CP.exec(`...${$VAR}...`, ...)
    message: >
      Shell execution via a dynamically-built command string (template
      literal or concatenation). exec()/execSync() always hand the string to
      a shell, so any tool-parameter-controlled content here is command
      injection — including from an LLM that an attacker steered via
      (possibly indirect) prompt injection.
      Fix: use child_process.spawn() or execFile() with an argv array instead
      of a shell string (archetype #4 — docker-mcp-server class).
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: ["CWE-78"]
      category: security
      subcategory: [ai-security, mcp]
      confidence: HIGH
      owasp: ["LLM01: Prompt Injection"]

  - id: mcp-python-shell-true-interpolation
    patterns:
      - pattern-either:
          - pattern: subprocess.Popen(f"...{$VAR}...", ..., shell=True, ...)
          - pattern: subprocess.run(f"...{$VAR}...", ..., shell=True, ...)
          - pattern: subprocess.call(f"...{$VAR}...", ..., shell=True, ...)
          - pattern: subprocess.Popen("...".format(...), ..., shell=True, ...)
          - pattern: subprocess.run("...".format(...), ..., shell=True, ...)
          - pattern: subprocess.call("...".format(...), ..., shell=True, ...)
          - pattern: os.system(f"...{$VAR}...")
          - pattern: os.system("...".format(...))
    message: >
      subprocess call with shell=True (or os.system) on a dynamically-built
      command string (f-string or .format()). This lets an LLM or user break
      out of the intended command context.
      Fix: set shell=False and pass a list of arguments (argv), or use
      shlex.quote() if a shell string is unavoidable (archetype #4).
      Note: this intentionally does NOT flag shell=True on a fully static
      string — that has no injection surface, and the repo's own dedicated
      command_injection rule already covers the blanket shell=True case.
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-78"]
      category: security
      subcategory: [ai-security, mcp]
      confidence: HIGH
      owasp: ["LLM01: Prompt Injection"]

  - id: mcp-lexical-path-containment-bypass
    patterns:
      - pattern: $PATH.startsWith($BASE)
      - pattern-inside: |
          $PATH = path.join(...);
          ...
          $PATH.startsWith($BASE)
      - pattern-not-inside: |
          $PATH = fs.realpathSync(...);
          ...
          $PATH.startsWith($BASE)
      - pattern-not-inside: |
          $PATH = await fs.promises.realpath(...);
          ...
          $PATH.startsWith($BASE)
    message: >
      Path boundary enforced with a lexical startsWith() check on a
      path.join() result, with no realpath resolution in between. Symlinks
      or ../ segments the joined path doesn't lexically eliminate can escape
      the intended directory.
      Fix: resolve with fs.realpathSync()/fs.promises.realpath() (or
      path.resolve() against the base) before the startsWith comparison
      (archetype #9 — sandbox escape via lexical path checks).
      Scope note: this only catches the assign-then-check shape shown above;
      an inline `path.join(base, p).startsWith(base)` with no intermediate
      variable is not matched.
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: ["CWE-22"]
      category: security
      subcategory: [ai-security, mcp]
      confidence: MEDIUM
      owasp: ["LLM06: Excessive Agency"]

  - id: mcp-insecure-url-allowlist
    patterns:
      - pattern-either:
          - pattern: $URL.startsWith("...")
          - pattern: $URL.includes($DOMAIN)
      - pattern-inside: |
          function $FUNC(..., $URL, ...) {
            ...
          }
    message: >
      URL/hostname allowlist enforced with startsWith()/includes() on the raw
      string. An attacker (or an LLM steered via indirect prompt injection)
      can bypass this with a URL like "https://allowed.com.attacker.net/" or
      "https://attacker.net/?x=allowed.com" — both pass a naive
      startsWith/includes check.
      Fix: parse with `new URL(input).hostname` and compare against a strict
      Set of allowed hostnames (archetype #5 / #8 — prefix-allowlist and
      SSRF-filter bypass).
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      cwe: ["CWE-918"]
      category: security
      subcategory: [ai-security, mcp]
      confidence: MEDIUM
      owasp: ["LLM06: Excessive Agency"]
