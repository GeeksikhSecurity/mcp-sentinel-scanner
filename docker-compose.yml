version: '3.8'

services:
  # Basic scan service
  scanner:
    build: .
    image: mcp-sentinel-scanner:latest
    volumes:
      - ./:/scan:ro
      - ./reports:/reports
    command: >
      /scan
      --format html
      -o /reports/security-report.html
    environment:
      - PYTHONUNBUFFERED=1

  # JSON output for automation
  scanner-json:
    build: .
    image: mcp-sentinel-scanner:latest
    volumes:
      - ./:/scan:ro
      - ./reports:/reports
    command: >
      /scan
      --format json
      -o /reports/scan-results.json
      --severity HIGH
    environment:
      - PYTHONUNBUFFERED=1

  # SARIF output for IDE integration
  scanner-sarif:
    build: .
    image: mcp-sentinel-scanner:latest
    volumes:
      - ./:/scan:ro
      - ./reports:/reports
    command: >
      /scan
      --format sarif
      -o /reports/results.sarif
    environment:
      - PYTHONUNBUFFERED=1

  # Full scan with all formats
  scanner-full:
    build: .
    image: mcp-sentinel-scanner:latest
    volumes:
      - ./:/scan:ro
      - ./reports:/reports
      - ./config.json:/config/config.json:ro
    command: >
      bash -c "
      python -m scripts.sentinel_cli /scan --config /config/config.json --format json -o /reports/scan.json &&
      python -m scripts.sentinel_cli /scan --config /config/config.json --format html -o /reports/scan.html &&
      python -m scripts.sentinel_cli /scan --config /config/config.json --format sarif -o /reports/scan.sarif &&
      python -m scripts.sentinel_cli /scan --config /config/config.json --format markdown -o /reports/scan.md
      "
    environment:
      - PYTHONUNBUFFERED=1

  # Continuous monitoring (watches for changes)
  scanner-watch:
    build: .
    image: mcp-sentinel-scanner:latest
    volumes:
      - ./:/scan:ro
      - ./reports:/reports
    command: >
      bash -c "
      while true; do
        python -m scripts.sentinel_cli /scan --format json -o /reports/scan-$(date +%Y%m%d-%H%M%S).json
        sleep 3600
      done
      "
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

# Example usage:
# docker-compose up scanner              # Basic HTML scan
# docker-compose up scanner-json         # JSON output
# docker-compose up scanner-sarif        # SARIF for IDE
# docker-compose up scanner-full         # All formats
# docker-compose up -d scanner-watch     # Continuous monitoring
